<title>P3A Due Diligence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sabit sol menü (portföy + proje bölümleri) + üst bar + içerik; dar ekranda menü kayar */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface-2:#eceef4; --line:#dcdfe8;
  --fg:#151a2c; --muted:#596178; --accent:#2b44c7; --accent-fg:#ffffff; --accent-soft:#e6e9fb;
  --mark:#e9b43c; --mark-soft:#fcf2d7;
  --ok:#1d7f55; --ok-soft:#e1f3ea; --warn:#9a6312; --warn-soft:#fbf0d9; --bad:#bd3b28; --bad-soft:#fbe6e2; --crit:#9f1d12;
  --info:#4b5bb8; --info-soft:#eceefb; --violet:#7a3fb0; --violet-soft:#f1e8fa;
  --paper:#fffdf8; --paper-ink:#23262f; --paper-line:#d9d4c6;
  --shadow:0 1px 2px rgba(20,26,50,.06),0 6px 24px rgba(20,26,50,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#161a2c; --surface-2:#1e2337; --line:#2a3049;
  --fg:#e6e8f1; --muted:#9aa2bb; --accent:#8a9dff; --accent-fg:#0e1120; --accent-soft:#232a52;
  --mark:#e0b54a; --mark-soft:#3a311c;
  --ok:#55c896; --ok-soft:#16352a; --warn:#e6ad4f; --warn-soft:#392d16; --bad:#f2806b; --bad-soft:#3d201c; --crit:#ff9b88;
  --info:#9fabff; --info-soft:#232a4d; --violet:#c9a2f0; --violet-soft:#33244a;
  --paper:#f4f1e8; --paper-ink:#23262f; --paper-line:#d9d4c6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2c; --surface-2:#1e2337; --line:#2a3049;
  --fg:#e6e8f1; --muted:#9aa2bb; --accent:#8a9dff; --accent-fg:#0e1120; --accent-soft:#232a52;
  --mark:#e0b54a; --mark-soft:#3a311c;
  --ok:#55c896; --ok-soft:#16352a; --warn:#e6ad4f; --warn-soft:#392d16; --bad:#f2806b; --bad-soft:#3d201c; --crit:#ff9b88;
  --info:#9fabff; --info-soft:#232a4d; --violet:#c9a2f0; --violet-soft:#33244a;
  --paper:#f4f1e8; --paper-ink:#23262f; --paper-line:#d9d4c6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- İskelet ---------- */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.02em;position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--mark);border:2px solid var(--surface)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.1}
.brand-name span{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .label{padding:10px 10px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .count{font-size:11.5px;font-weight:700;background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:99px}
.proj-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;margin:0 2px}
.proj-card b{font-family:var(--f-display);font-size:15px}
.side-foot{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:600;max-width:280px}
.top .spacer{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--mark-soft);color:var(--warn);display:grid;place-items:center;font-weight:700;font-size:12.5px;border:1px solid var(--line)}
.menu-btn{display:none}
.demo-tag{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--mark-soft);padding:3px 9px;border-radius:99px}
#view{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:18px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t tr.sel td{background:var(--accent-soft)}
.t .who{font-weight:600}
.t .sub{font-size:12px;color:var(--muted)}
.t tr.grp td{background:var(--surface-2);font-weight:700;font-size:12.5px;padding-block:8px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}

/* ---------- Etiketler ---------- */
.sev{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
.sev-kritik{background:var(--crit);color:var(--surface)}
.sev-yuksek{background:var(--bad-soft);color:var(--bad)}
.sev-orta{background:var(--warn-soft);color:var(--warn)}
.sev-dusuk{background:var(--surface-2);color:var(--muted)}
.kind{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.kind-gercek{color:var(--info)} .kind-det{color:var(--ok)} .kind-ai{color:var(--violet)} .kind-hip{color:var(--warn)} .kind-tam{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-acik{background:var(--mark-soft);color:var(--warn)}
.st-onay{background:var(--ok-soft);color:var(--ok)}
.st-red{background:var(--surface-2);color:var(--muted)}
.st-var{background:var(--ok-soft);color:var(--ok)}
.st-kismi{background:var(--warn-soft);color:var(--warn)}
.st-eksik{background:var(--bad-soft);color:var(--bad)}
.st-sure{background:var(--bad-soft);color:var(--bad)}
.st-taslak{background:var(--warn-soft);color:var(--warn)}
.st-wait{background:var(--info-soft);color:var(--info)}
.st-wait::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.7;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.src{display:inline-flex;gap:6px;align-items:baseline;font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--surface-2);margin:2px 4px 2px 0}
.src b{font-variant-numeric:tabular-nums}
.src.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- Form ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}

/* ---------- Risk matrisi ---------- */
.matrix{display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(4,minmax(46px,1fr));gap:4px;font-size:12.5px}
.matrix .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.matrix .a{padding:7px 4px;font-weight:600}
.matrix .c{border-radius:6px;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums;min-height:32px;background:var(--surface-2);color:var(--muted)}
.matrix .c.z{opacity:.45;font-weight:500}
.matrix .c.k{background:var(--crit);color:var(--surface)}
.matrix .c.y{background:var(--bad-soft);color:var(--bad)}
.matrix .c.o{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .d{font-family:var(--f-mono);font-size:12px;font-weight:600}
.tl.past .d{color:var(--bad)}

/* ---------- Data room ---------- */
.dr{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.cats{display:flex;flex-direction:column;gap:2px;padding:8px}
.cats button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.cats button:hover{background:var(--surface-2)}
.cats button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cats .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.conf{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.conf.low{color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.fname{font-weight:600;word-break:break-all}

/* ---------- Bulgular ---------- */
.issues{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.ilist{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:3px solid transparent;border-top:0;border-right:0;width:100%}
.irow:hover{background:var(--surface-2)}
.irow.on{background:var(--accent-soft);border-left-color:var(--accent)}
.irow .id{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.irow .ttl{font-weight:600}
.irow .meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.detail{position:sticky;top:84px}
.evid{display:flex;flex-direction:column;gap:10px}
.paper{background:var(--paper);color:var(--paper-ink);padding:14px 16px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:12.5px;border:1px solid var(--paper-line)}
.paper .ph{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:11.5px;color:#6a6658;border-bottom:1px solid var(--paper-line);padding-bottom:6px;margin-bottom:8px}
.paper q{quotes:none;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.55}
.paper mark{background:rgba(233,180,60,.45);color:inherit;padding:0 2px;border-radius:2px}
.why{border-left:3px solid var(--violet);padding:4px 0 4px 12px}
.reco{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.audit{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}

/* ---------- Rapor ---------- */
.report{background:var(--paper);color:var(--paper-ink);max-width:820px;width:100%;margin:0 auto;padding:44px 52px;box-shadow:0 2px 14px rgba(0,0,0,.12);border-radius:3px;display:flex;flex-direction:column;gap:22px;font-size:13.5px}
.report h1{font-size:26px;color:var(--paper-ink)}
.report h2{font-size:16px;color:var(--paper-ink);border-bottom:2px solid var(--paper-ink);padding-bottom:4px}
.report .rk{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:#6a6658;text-transform:uppercase}
.report table{width:100%;border-collapse:collapse;font-size:12.5px}
.report th,.report td{border-bottom:1px solid var(--paper-line);padding:6px 6px;text-align:left;vertical-align:top}
.report td:first-child{white-space:nowrap}
.report th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6a6658}
.report ol,.report ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rsev{font-weight:800;font-size:11px}
.rsev.kritik{color:#9f1d12} .rsev.yuksek{color:#bd3b28} .rsev.orta{color:#9a6312} .rsev.dusuk{color:#6a6658}

/* ---------- Giriş ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.auth-art{background:var(--accent);color:var(--accent-fg);padding:48px max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;justify-content:space-between}
.auth-art h1{font-size:38px;line-height:1.08;max-width:17ch}
.auth-art .lead{font-size:16px;opacity:.88;max-width:46ch}
.auth-art .brand-mark{background:var(--accent-fg);color:var(--accent)}
.auth-art .brand-mark::after{border-color:var(--accent)}
.flow{display:flex;flex-direction:column;max-width:440px}
.flow div{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--accent-fg) 22%,transparent)}
.flow b{font-family:var(--f-mono);font-size:12px;opacity:.7;padding-top:2px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
.auth-form form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}

.modal-bg{position:fixed;inset:0;background:rgba(10,12,24,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:580px;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .card-h{position:sticky;top:0;background:var(--surface)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.issues{grid-template-columns:minmax(0,1fr)}.detail{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:264px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-left:max(14px,env(safe-area-inset-left,0px));padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,24,.4)}
  .menu-btn{display:inline-flex}
  .top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-art{padding:32px max(16px,env(safe-area-inset-left,0px))}
  .auth-art h1{font-size:28px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .dr{grid-template-columns:minmax(0,1fr)}
  .cats{flex-direction:row;overflow-x:auto}
  .cats button{white-space:nowrap}
  .report{padding:28px 20px}
  .top select{max-width:190px}
}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}.demo-tag{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="root"></div>
<div id="toast" hidden></div>
<div id="modal-root"></div>

<script>
/* =========================================================
   P3A Due Diligence — tıklanabilir arayüz prototipi (Ürün 01)
   Tüm proje, belge ve bulgu verileri uydurmadır.
   ========================================================= */

      <div class="reco"><div class="label" style="margin-bottom:4px">Öneri</div>${esc(f.reco)}</div>
      <div class="fgrid">
        <div class="field"><label for="ex-sev">Uzman seviyesi</label><select id="ex-sev">${Object.entries(SEV).map(([k,v])=>`<option value="${k}" ${f.sev===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field full"><label for="ex-note">Uzman notu</label><textarea id="ex-note" placeholder="Rapora girecek değerlendirme veya satıcıya sorulacak soru">${esc(f.note||'')}</textarea></div>
      </div>
      <div class="audit"><div class="label">Denetim izi</div>${f.log.map(l=>`<span>${esc(l)}</span>`).join('')}</div>
    </div>
    <div class="row" style="justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)">
      <button class="btn danger" onclick="App.decide('${f.id}','red')">Reddet</button>
      <button class="btn ok" onclick="App.decide('${f.id}','onay')">Doğrula ve rapora ekle</button>
    </div>
  </div>`;
}

/* ---------- Rapor ---------- */
function vRapor(){
  const p=P();
  const fs=S.findings.filter(f=>f.st!=='red'&&(!S.onlyApproved||f.st==='onay'));
  const order=['kritik','yuksek','orta','dusuk'];
  fs.sort((a,b)=>order.indexOf(a.sev)-order.indexOf(b.sev));
  const red=fs.filter(f=>f.sev==='kritik'||f.sev==='yuksek');
  const missing=S.checklist.filter(c=>c.st!=='var');
  return `<div class="head"><div><h1>DD raporu</h1><p class="muted">Taslak · bulgular ve uzman notlarından otomatik üretilir</p></div>
    <div class="row"><label class="check"><input id="only-ap" type="checkbox" ${S.onlyApproved?'checked':''} onchange="App.onlyAp(this.checked)"> <span>Yalnız uzman doğrulamış bulgular</span></label>
    <button class="btn primary" onclick="App.toast('Word / PDF çıktısı gerçek sürümde üretilir (prototip).')">Word olarak indir</button></div></div>
  <article class="report">
    <div><div class="rk">Teknik ve izin due diligence raporu · taslak v0.3</div><h1 style="margin-top:6px">${esc(p.name)} · ${esc(p.cap)}</h1><p style="margin-top:6px">${esc(p.deal)} · Hazırlanan: ${esc(p.client)} · ${fmtDate(TODAY)}</p></div>
    <section style="display:flex;flex-direction:column;gap:10px"><h2>1. Yönetici özeti</h2>
      <p>Data room'da ${S.docs.length} belge (${S.docs.reduce((s,d)=>s+d.pages,0)} sayfa) incelendi. Kontrol listesine göre belge tamlığı %${completeness()}. Toplam ${fs.length} bulgu raporlandı; ${fs.filter(f=>f.sev==='kritik').length} kritik ve ${fs.filter(f=>f.sev==='yuksek').length} yüksek seviyeli.</p>
      <p>En önemli konu, ÇED olumlu kararının 12 türbini kapsaması ve projenin 13 türbinle kurgulanmasıdır. Ayrıca lisanstaki tesis tamamlama süresi (14.03.2027) mevcut EPC programıyla karşılanamıyor ve T7–T8 orman izinlerinin süresi dolmuş durumda.</p></section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2>2. Kırmızı bayraklar</h2>
      ${red.length?`<table><thead><tr><th>No</th><th>Bulgu</th><th>Seviye</th><th>Kaynak</th></tr></thead><tbody>${red.map(f=>`<tr><td>${f.id}</td><td>${esc(f.t)}${f.st!=='onay'?' <i style="color:#9a6312">(doğrulama bekliyor)</i>':''}</td><td class="rsev ${f.sev}">${SEV[f.sev].toUpperCase()}</td><td>${f.ev.map(e=>esc(e[0])+' s. '+e[2]).join('; ')||'Tamlık kontrolü'}</td></tr>`).join('')}</tbody></table>`:'<p>Doğrulanmış kırmızı bayrak yok.</p>'}</section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2>3. Kapanış öncesi şartlar (CP) ve talepler</h2>
      <ol>${fs.filter(f=>f.sev!=='dusuk').map(f=>`<li>${esc(f.reco)} <span style="color:#6a6658">[${f.id}]</span></li>`).join('')}</ol></section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2>4. Alan bazında bulgular</h2>
      <table><thead><tr><th>No</th><th>Alan</th><th>Bulgu</th><th>Tür</th><th>Seviye</th></tr></thead><tbody>${fs.map(f=>`<tr><td>${f.id}</td><td>${CATS[f.area]}</td><td>${esc(f.t)}${f.note?`<br><span style="color:#6a6658">Uzman notu: ${esc(f.note)}</span>`:''}</td><td>${KIND[f.kind][0]}</td><td class="rsev ${f.sev}">${SEV[f.sev]}</td></tr>`).join('')}</tbody></table></section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2>5. Eksik veya kısmi belgeler</h2>
      <ul>${missing.map(c=>`<li><b>${esc(c.item)}</b> · ${CST[c.st]}${c.note?' · '+esc(c.note):''}</li>`).join('')}</ul></section>
    <section style="display:flex;flex-direction:column;gap:10px"><h2>6. Kapsam ve sınırlamalar</h2>
      <p>Bu rapor teknik, izin ve mevzuat, bağlantı, arazi, çevre ve sözleşme belgelerinin data room üzerinden incelenmesine dayanır. Saha ziyareti, finansal model, vergi ve sigorta incelemesi kapsam dışıdır. "AI yorumu" ve "hipotez" olarak işaretlenen bulgular uzman değerlendirmesi gerektirir.</p></section>
  </article>`;
}

/* ---------- Çizim ---------- */
function render(){
  const r=route(); const root=document.getElementById('root'); close();
  if(r==='giris'){ root.innerHTML=vGiris(); return; }
  const views={projeler:vProjeler,ozet:vOzet,dataroom:vDataroom,tamlik:vTamlik,bilgiler:vBilgiler,bulgular:vBulgular,rapor:vRapor};
  root.innerHTML=shell(r,views[r]());
  if(r==='dataroom') bindDrop();
}
function bindDrop(){
  const z=document.getElementById('drop'); if(!z) return;
  ['dragenter','dragover'].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.remove('over');}));
  z.addEventListener('drop',ev=>App.upload(ev.dataTransfer.files));
}
function guess(name){
  const n=name.toLocaleLowerCase('tr');
  const rules=[[/lisans|epdk/,'lisans','Lisans belgesi'],[/teias|teiaş|baglanti|bağlantı/,'baglanti','Bağlantı belgesi'],[/tapu|orman|kira|irtifak|kamulas/,'arazi','Arazi belgesi'],[/ced|çed|ornito|gurultu|gürültü/,'cevre','Çevre belgesi'],[/imar|ruhsat|kabul/,'imar','İmar / ruhsat belgesi'],[/olcum|ölçüm|uretim|üretim|jeotek|yerlesim|yerleşim/,'teknik','Teknik rapor'],[/epc|tsa|o&m|sozlesme|sözleşme/,'sozlesme','Sözleşme'],[/sicil|pay|ana sozlesme/,'kurumsal','Kurumsal belge']];
  const m=rules.find(r=>r[0].test(n)); return m?[m[1],m[2],.9]:['diger','—',.45];
}

/* ---------- Eylemler ---------- */
window.App={
  go,toast,close,newProject,docInfo,
  login(){ go('ozet'); toast('Hoş geldin, Alperen'); },
  openProject(id){ const p=S.projects.find(x=>x.id===id); if(!p.detailed){ toast(`${p.name}: prototipte ayrıntılı veri yalnız Akçalı RES için var.`); const s=document.getElementById('proj-sel'); if(s) s.value=S.proj; return; } S.proj=id; go('ozet'); },
  saveProject(){ const v=k=>document.getElementById(k).value.trim(); S.projects.push({id:'p'+Date.now(),name:v('np-name'),type:v('np-type'),loc:v('np-loc')||'—',cap:v('np-cap')||'—',stage:v('np-stage'),deal:v('np-deal'),client:'—',due:v('np-due')||'2026-12-31',state:'Yeni'}); close(); toast('Proje oluşturuldu · sıradaki adım data room yükleme'); render(); },
  setCat(c){ S.catSel=c; render(); },
  reclass(id,cat){ if(!cat) return; const d=D(id); d.cat=cat; d.type=CATS[cat]+' belgesi'; d.conf=1; toast(`${d.file} → ${CATS[cat]} (elle sınıflandırıldı, model bu düzeltmeden öğrenir)`); render(); },
  upload(files){ [...files].forEach(f=>{ const name=f.name; S.uploading.push(name); setTimeout(()=>{ S.uploading=S.uploading.filter(x=>x!==name); const [cat,type,conf]=guess(name); S.docs.unshift({id:'d'+Date.now()+Math.random(),file:name,cat,type,conf,pages:Math.max(1,Math.round(f.size/40000))||1,date:TODAY,flag:''}); if(route()==='dataroom') render(); toast(`${name} → ${CATS[cat]}`); },1600); }); render(); },
  openFinding(id){ S.fSel=id; S.fSev='all'; S.fArea='all'; S.fSt='all'; close(); go('bulgular'); },
  selFinding(id){ S.fSel=id; render(); if(window.innerWidth<1100) document.querySelector('.detail')?.scrollIntoView({behavior:'smooth'}); },
  flt(k,v){ S[k]=v; render(); },
  decide(id,st){ const f=F(id); const ns=document.getElementById('ex-sev').value; const note=document.getElementById('ex-note').value.trim(); const now='31.10.2026 '+new Date().toTimeString().slice(0,5);
    if(ns!==f.sev) f.log.push(`Alperen Gültekin seviyeyi değiştirdi: ${SEV[f.sev]} → ${SEV[ns]} · ${now}`);
    f.sev=ns; f.note=note; f.st=st; f.log.push(`Alperen Gültekin ${st==='onay'?'doğruladı':'reddetti'} · ${now}`);
    toast(st==='onay'?`${id} doğrulandı, rapora eklendi`:`${id} reddedildi, rapordan çıkarıldı`);
    const next=filtered().find(x=>x.st==='acik'); if(next) S.fSel=next.id; render(); },
  onlyAp(v){ S.onlyApproved=v; render(); }
};
render();
})();
</script>
